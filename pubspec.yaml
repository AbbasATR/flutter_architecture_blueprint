name: flutter_architecture_blueprint
description: A Flutter application showcasing Clean Architecture principles with BLoC pattern and mock backend integration.

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.8.1

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  
  # State Management
  flutter_bloc: ^8.1.6
  equatable: ^2.0.7
  
  # Dependency Injection
  get_it: ^8.0.3
  
  # Networking
  dio: ^5.7.0
  cookie_jar: ^4.0.8
  dio_cookie_manager: ^3.2.0
  cached_network_image: ^3.4.1
  
  # Storage
  shared_preferences: ^2.3.5
  flutter_secure_storage: ^9.2.2
  path_provider: ^2.1.5
  
  # Functional Programming
  dartz: ^0.10.1
  
  # Utilities
  cupertino_icons: ^1.0.8
  path: ^1.9.0
  intl: ^0.20.2
  package_info_plus: 9.0.0
  loading_animation_widget: ^1.3.0
  image: ^4.5.2
  pinput: ^5.0.2
  iconsax_plus: ^1.0.0
  flutter_osm_plugin: ^1.4.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  
  # Testing
  mockito: ^5.4.4
  mocktail: ^1.0.4
  build_runner: ^2.4.13
  bloc_test: ^9.1.0


flutter:
  generate: true

  uses-material-design: true

  # To add assets to your application, add an assets section, like this:
  assets:
    - assets/
    - assets/images/
    - assets/images/utils/
    - assets/images/categories/
    - assets/images/food/
    - assets/fonts/SFPro/
    - assets/fonts/Dubai/

  fonts:
    - family: SF Pro
      fonts:
        - asset: assets/fonts/SFPro/SF-Pro-Display-Regular.ttf
        - asset: assets/fonts/SFPro/SF-Pro-Display-Medium.ttf
          weight: 500
        - asset: assets/fonts/SFPro/SF-Pro-Display-Semibold.ttf
          weight: 600
        - asset: assets/fonts/SFPro/SF-Pro-Display-Bold.ttf
          weight: 700

    - family: Dubai
      fonts:
        - asset: assets/fonts/Dubai/Dubai-Regular.ttf
        - asset: assets/fonts/Dubai/Dubai-Bold.ttf
          weight: 700