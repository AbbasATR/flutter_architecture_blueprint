name: Flutter CI

permissions:
  contents: read
  actions: write

on:
  push:
    branches:
      - master
      - main
      - dev
      - 'release/**'
  pull_request:
  workflow_dispatch:

jobs:
  analyze_and_test:
    name: Analyze and Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Run static analysis
        run: flutter analyze

      - name: Run tests
        run: flutter test

  build_apk:
    name: Build Android APK
    needs: analyze_and_test
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' &&
        (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/dev'))
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build release APK
        run: flutter clean && flutter pub get && flutter build apk --release

      - name: Delete stale artifacts
        if: github.event_name != 'pull_request'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const maxAgeDays = 7;
            const cutoff = Date.now() - maxAgeDays * 24 * 60 * 60 * 1000;
            let page = 1;
            let deleted = 0;
            while (true) {
              const { data } = await github.rest.actions.listArtifactsForRepo({
                owner: context.repo.owner,
                repo: context.repo.repo,
                per_page: 100,
                page,
              });
              if (!data.artifacts.length) {
                break;
              }
              for (const artifact of data.artifacts) {
                if (artifact.expired) continue;
                if (new Date(artifact.created_at).getTime() < cutoff) {
                  await github.rest.actions.deleteArtifact({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    artifact_id: artifact.id,
                  });
                  deleted++;
                }
              }
              page++;
            }
            core.summary.addHeading('Artifact cleanup');
            core.summary.addRaw(`Deleted ${deleted} old artifact${deleted === 1 ? '' : 's'}.`);
            await core.summary.write();

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: jet-customer-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 7
